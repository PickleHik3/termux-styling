plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace "com.termux.styling"

    compileSdk project.properties.compileSdkVersion.toInteger()

    def appVersionName = System.getenv("TERMUX_STYLING_APP_BUILD__APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_STYLING_APP_BUILD__APK_VERSION_TAG") ?: ""

    // The Termux Launcher edition this build prefers. Set via the `termuxLauncherPackageName`
    // gradle property (see gradle.properties) or the environment variable below. The app still
    // falls back to probing the other known editions at runtime if this one is not installed.
    def launcherPackageName = System.getenv("TERMUX_STYLING_APP_BUILD__LAUNCHER_PACKAGE_NAME") ?:
            (project.findProperty("termuxLauncherPackageName") ?: "com.termux")

    buildFeatures {
        buildConfig true
    }

     defaultConfig {
        applicationId "${launcherPackageName}.styling"
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        versionCode 1001
        versionName "0.32.2"

        buildConfigField "String", "TERMUX_LAUNCHER_PACKAGE_NAME", "\"${launcherPackageName}\""

        // The launcher declares `android:sharedUserId="${TERMUX_PACKAGE_NAME}"`, i.e. its shared user
        // id is always its own application id. To be able to write into the launcher's private files
        // dir this app must declare the exact same shared user id, so it is pinned to the same
        // edition as the target package above. Note that this fixes the reachable edition at build
        // time: one styling APK per launcher edition.
        buildConfigField "String", "TERMUX_LAUNCHER_SHARED_USER_ID", "\"${launcherPackageName}\""
        manifestPlaceholders = [TERMUX_LAUNCHER_SHARED_USER_ID: launcherPackageName]

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

     buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = new File("termux-styling-app_" +
                    (apkVersionTag ? apkVersionTag : "v" + versionName + "+" + variant.buildType.name) +
                    "_" + launcherPackageName + ".apk")
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '" + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}
